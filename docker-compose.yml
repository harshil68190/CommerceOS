# docker-compose.yml
#
# Responsibility: orchestrates the three services this milestone needs —
# the FastAPI backend, PostgreSQL, and Redis — for local development and
# integration testing. Every service has a healthcheck, and the backend
# only starts once its real dependencies (Postgres, Redis) report
# healthy, not just "started" — this avoids the classic race condition
# where the app boots before Postgres is actually ready to accept
# connections.
#
# This is the BASE compose file. It intentionally runs the backend in
# production mode (no --reload, no source mount). For a local hot-reload
# development loop, layer `docker-compose.dev.yml` on top:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# NOTE (path layout): the Dockerfile, .env, and app source all live
# under `./backend`. The build context and env_file must therefore point
# at `./backend`, NOT the repo root. This was the original bug in this
# file — the healthcheck/volumes were correct but the backend service
# pointed at the wrong context.

services:
  backend:
    build:
      # Dockerfile lives in backend/, so the build context must be
      # backend/ (not the repo root where this compose file sits).
      context: ./backend
      dockerfile: Dockerfile
    image: commerceos-backend:latest
    container_name: commerceos_backend
    ports:
      - "8000:8000"
    env_file:
      # The app reads its runtime config from backend/.env (see
      # app/core/config.py). Non-secret values are overridable via
      # environment: below; secrets stay in .env / the host env.
      - ./backend/.env
    environment:
      # Compose-services hostnames are used here so the app inside the
      # container reaches Postgres/Redis by service name, not localhost.
      # These override the localhost values in backend/.env (which are
      # only correct when running the app natively on the host).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-commerceos}:${POSTGRES_PASSWORD:-commerceos}@postgres:5432/${POSTGRES_DB:-commerceos}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: commerceos_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commerceos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerceos}
      POSTGRES_DB: ${POSTGRES_DB:-commerceos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commerceos} -d ${POSTGRES_DB:-commerceos}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: commerceos_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

# Named volumes persist data across `docker compose down`/`up` cycles —
# without these, every restart would silently wipe the database, which
# is fine for CI but wrong for local development.
volumes:
  postgres_data:
  redis_data:
