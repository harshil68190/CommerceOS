# CommerceOS free-tier portfolio demo.
# Free Render API + free Render Static Site; external free PostgreSQL/Redis.
# Review all provider limits and prices before creating any resources.
#
# Required environment variables to enter in Render:
#   DATABASE_URL  - Neon PostgreSQL connection string
#   REDIS_URL     - Upstash Redis TLS URL (usually rediss://...)
#   JWT_SECRET_KEY - newly generated random secret
#   CORS_ORIGINS  - exact frontend origin, e.g. https://commerceos-frontend.onrender.com
#   VITE_API_URL  - API base URL, e.g. https://commerceos-api.onrender.com/api/v1
#
# Portfolio/demo only. The free API sleeps after inactivity. Migrations run
# at startup because Render preDeployCommand is not available on free services.

services:
  - type: web
    name: commerceos-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COMMERCEOS_ENV_FILE
        value: /dev/null
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RUN_MIGRATIONS
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "0"

  - type: web
    name: commerceos-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
