# CommerceOS Render Blueprint
# Review plan pricing/availability before provisioning resources.
# Configure these two values in the Render Dashboard after the first sync:
#   JWT_SECRET_KEY - a long, randomly generated secret
#   CORS_ORIGINS   - exact deployed frontend origin, e.g. https://commerceos-frontend.onrender.com
# Also set VITE_API_URL on the frontend service to the API base URL, e.g.
#   https://commerceos-api.onrender.com/api/v1

services:
  # Redis-compatible managed Key Value store. Internal-only access.
  - type: keyvalue
    name: commerceos-redis
    region: singapore
    plan: 256mb
    maxmemoryPolicy: allkeys-lru
    persistenceMode: journal-snapshot
    ipAllowList: []

  # FastAPI backend
  - type: web
    name: commerceos-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    preDeployCommand: alembic upgrade head
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COMMERCEOS_ENV_FILE
        value: /dev/null
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: commerceos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: commerceos-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RUN_MIGRATIONS
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: DB_POOL_SIZE
        value: "5"

  # React/Vite frontend hosted as a Render Static Site.
  - type: web
    name: commerceos-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: commerceos-db
    databaseName: commerceos
    user: commerceos
    postgresMajorVersion: "16"
    plan: 0.1c-256mb
    region: singapore
    # Restrict public connections; services in this region can use the private URL.
    ipAllowList: []
