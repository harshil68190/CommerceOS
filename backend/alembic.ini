; alembic.ini
;
; Responsibility: Alembic's own configuration — where migration scripts
; live and how they're named. The actual database URL is intentionally
; NOT hardcoded here (see the commented-out sqlalchemy.url below); it is
; read from Settings/DATABASE_URL inside alembic/env.py instead, so the
; same migration setup works unmodified across dev/staging/prod without
; ever committing a connection string to version control.

[alembic]
script_location = alembic

# Template used to generate migration filenames. Prefixing with the
# revision date keeps `alembic/versions/` sorted chronologically when
# browsed in a file explorer, which matters once there are dozens of
# migration files.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone used when rendering the timestamp above.
timezone = UTC

# sqlalchemy.url is deliberately omitted here — see alembic/env.py,
# which loads it from app.core.config.Settings at runtime instead.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
